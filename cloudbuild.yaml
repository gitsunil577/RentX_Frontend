# Cloud Build configuration for E-Rental Frontend
# IMPORTANT: Set these substitution variables in Cloud Build trigger:
# _BACKEND_URL: Your backend URL (e.g., https://your-backend-url.run.app)
# _RAZORPAY_KEY_ID: Your Razorpay key ID (e.g., rzp_test_xxxxx)

steps:
  # Build the container image with build arguments
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_BACKEND_URL}'
      - '--build-arg'
      - 'VITE_RAZORPAY_KEY_ID=${_RAZORPAY_KEY_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rentx'
      - '--image'
      - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'

substitutions:
  _BACKEND_URL: 'http://localhost:8080'
  _RAZORPAY_KEY_ID: 'rzp_test_default'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
