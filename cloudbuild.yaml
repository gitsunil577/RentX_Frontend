# Cloud Build configuration for E-Rental Frontend
steps:
  # Build the container image with build arguments
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_BASE_URL=${_BACKEND_URL}/api/v1'
      - '--build-arg'
      - 'VITE_RAZORPAY_KEY_ID=${_RAZORPAY_KEY_ID}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'e-rental-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'

images:
  - 'gcr.io/$PROJECT_ID/e-rental-frontend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
